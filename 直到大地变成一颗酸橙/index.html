<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直到大地变成一颗酸橙 · UI 动效复刻</title><link rel="stylesheet" href="style.css"></head>
<body><main id="viewport"><div id="stage"><canvas id="scene" width="1920" height="1080" aria-label="活动插画与动画"></canvas><div id="home-controls" aria-label="主页入口"><button data-hit="btn_zone" aria-label="驶向大地尽头"></button><button data-hit="btn_ex" aria-label="踏上归家长途"></button><button data-hit="btn_s" aria-label="眺望待行之路"></button><button data-hit="btn_switch" aria-label="切换主页插画"></button></div><nav id="game-nav" hidden><button id="back" aria-label="返回主页"><img src="assets/native/navigation/btn_topmenu_back.png" alt=""></button><button id="home-button" aria-label="主页"><img src="assets/native/navigation/btn_topmenu_home.png" alt=""></button></nav><nav id="map-tabs" hidden aria-label="章节"><button data-route="normal" aria-label="驶向大地尽头"></button><button data-route="ex" aria-label="踏上归家长途"></button><button data-route="s" aria-label="眺望待行之路"></button></nav><div id="blackout"></div><div id="loading" role="status">正在载入原版图层…</div></div></main>
<footer id="transport"><div class="transport-title"><span class="dot"></span><strong>酸橙 · 动效复刻</strong><small id="scene-label">主界面入场</small></div><div class="transport-controls"><button id="replay">↺ 重播</button><button id="pause" aria-pressed="false">Ⅱ 暂停</button><button id="variant">切换插画</button><label>速度 <select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><button id="fullscreen">全屏</button><button id="notes-toggle">还原记录</button></div><label class="scrub"><span id="time-label">0.00s</span><input id="timeline" aria-label="入场时间线" type="range" min="0" max="5.17" step="0.01" value="0"><span id="duration">5.17s</span></label></footer>
<aside id="notes" hidden><button id="notes-close" aria-label="关闭还原记录">×</button><h1>还原记录</h1><p>主页与三张地图使用活动原包的独立图层。标题、人物、行李、线条及地图装饰按原动画轨道播放。公路透视与 Unity 材质效果正在逐段校准。</p><p>红框 UI、明日方舟 Logo、关卡节点和地图余额保持移除。空格暂停，R 重播，B 切换插画，Esc 返回，H 隐藏工具栏。</p><p>原动画关键帧移植不等于逐帧验收完成；浏览器材质与粒子仍有差异。详见 <a href="README.md" target="_blank">使用说明</a>。</p></aside><script type="module" src="app.js"></script></body></html>
